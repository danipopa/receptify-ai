apiVersion: v1
kind: PersistentVolume
metadata:
  name: receptify-dev-moshi-cache-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/receptify-dev/moshi-cache
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moshi-cache
  namespace: receptify-dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: receptify-dev-moshi-cache-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moshi
  namespace: receptify-dev
  labels:
    app: moshi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moshi
  template:
    metadata:
      labels:
        app: moshi
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: moshi
          image: 192.168.100.16:30501/receptify-dev/moshi-service:cpu-demo-20261020-r1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8998
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: TORCH_HOME
              value: /models/torch
            - name: MOSHI_CPU_THREADS
              value: "4"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 20Gi
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: moshi-cache
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moshi
  namespace: receptify-dev
spec:
  type: NodePort
  selector:
    app: moshi
  ports:
    - name: http
      port: 8998
      targetPort: http
      nodePort: 30998
